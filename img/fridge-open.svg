<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="La nevera abierta: hay comida normal, pero falta la tarta en el centro">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d348b"/><stop offset="1" stop-color="#7678ed"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#fffde7"/><stop offset="1" stop-color="#cfe3ef"/></radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#wall)"/>
  <polygon points="125,40 20,0 20,400 125,350" fill="#fff8b5" opacity=".25"/>
  <rect x="0" y="340" width="400" height="60" fill="#f18701"/>
  <path d="M0 340h400" stroke="#9e4a00" stroke-width="4"/>
  <ellipse cx="225" cy="352" rx="120" ry="10" fill="#000" opacity=".25"/>
  <!-- cuerpo -->
  <rect x="125" y="40" width="200" height="310" rx="26" fill="#e9ecef" stroke="#2b2d42" stroke-width="6"/>
  <rect x="140" y="55" width="170" height="280" rx="14" fill="url(#glow)" stroke="#2b2d42" stroke-width="4"/>
  <!-- puerta abierta -->
  <path d="M325 45 L392 20 L392 375 L325 348 Z" fill="#f1faee" stroke="#2b2d42" stroke-width="6" stroke-linejoin="round"/>
  <rect x="338" y="90" width="44" height="10" rx="4" fill="#adb5bd" stroke="#2b2d42" stroke-width="3"/>
  <rect x="338" y="200" width="44" height="10" rx="4" fill="#adb5bd" stroke="#2b2d42" stroke-width="3"/>
  <rect x="346" y="60" width="10" height="30" rx="3" fill="#ffd166" stroke="#2b2d42" stroke-width="2"/>
  <rect x="362" y="55" width="12" height="35" rx="3" fill="#ef476f" stroke="#2b2d42" stroke-width="2"/>
  <rect x="344" y="160" width="16" height="40" rx="4" fill="#fff" stroke="#2b2d42" stroke-width="2"/>
  <rect x="364" y="165" width="14" height="35" rx="4" fill="#06d6a0" stroke="#2b2d42" stroke-width="2"/>
  <!-- baldas -->
  <g stroke="#2b2d42" stroke-width="4"><line x1="140" y1="125" x2="310" y2="125"/><line x1="140" y1="215" x2="310" y2="215"/><line x1="140" y1="285" x2="310" y2="285"/></g>
  <!-- balda de arriba: leche, huevos, yogures -->
  <rect x="152" y="70" width="28" height="55" rx="5" fill="#fff" stroke="#2b2d42" stroke-width="3"/>
  <rect x="152" y="85" width="28" height="14" fill="#4cc9f0"/>
  <g fill="#fff3d6" stroke="#2b2d42" stroke-width="2"><ellipse cx="200" cy="114" rx="8" ry="10"/><ellipse cx="217" cy="114" rx="8" ry="10"/><ellipse cx="234" cy="114" rx="8" ry="10"/></g>
  <g stroke="#2b2d42" stroke-width="2"><rect x="255" y="100" width="18" height="24" rx="3" fill="#ffafcc"/><rect x="278" y="100" width="18" height="24" rx="3" fill="#cdb4db"/></g>
  <!-- balda del medio: hueco vacío donde estaba la tarta -->
  <rect x="152" y="160" width="26" height="54" rx="4" fill="#80b918" stroke="#2b2d42" stroke-width="3"/>
  <ellipse cx="225" cy="207" rx="40" ry="7" fill="#fff" stroke="#2b2d42" stroke-width="3" stroke-dasharray="6 5"/>
  <g fill="#f7b801"><circle cx="210" cy="203" r="2.5"/><circle cx="233" cy="206" r="2"/><circle cx="244" cy="201" r="2.5"/></g>
  <path d="M190 150 q35 -35 70 0" fill="none" stroke="#ff4d6d" stroke-width="3" stroke-dasharray="5 5"/>
  <text x="225" y="180" font-size="30" text-anchor="middle" fill="#ff4d6d" font-family="Comic Sans MS, Comic Neue, cursive" font-weight="bold">?</text>
  <circle cx="290" cy="195" r="16" fill="#f94144" stroke="#2b2d42" stroke-width="3"/>
  <path d="M290 179 q4 -8 10 -8" stroke="#2b2d42" stroke-width="3" fill="none"/>
  <!-- balda de abajo: queso, jamón, verduras -->
  <path d="M152 280 l40 0 l0 -28 z" fill="#ffd166" stroke="#2b2d42" stroke-width="3"/>
  <ellipse cx="225" cy="268" rx="22" ry="14" fill="#ffadad" stroke="#2b2d42" stroke-width="3"/>
  <rect x="255" y="245" width="45" height="35" rx="6" fill="#caffbf" stroke="#2b2d42" stroke-width="3"/>
  <!-- cajón de verduras -->
  <rect x="150" y="292" width="150" height="36" rx="6" fill="#bde0fe" opacity=".8" stroke="#2b2d42" stroke-width="3"/>
  <g fill="#f77f00"><path d="M170 300 l6 25 l6 -25z"/><path d="M190 300 l6 25 l6 -25z"/></g>
  <circle cx="240" cy="312" r="10" fill="#80b918"/><circle cx="268" cy="312" r="10" fill="#d00000"/>
  <!-- huellas de chocolate -->
  <g fill="#6f4518" opacity=".85"><ellipse cx="90" cy="372" rx="9" ry="5"/><ellipse cx="60" cy="385" rx="9" ry="5"/><ellipse cx="30" cy="370" rx="9" ry="5"/></g>
</svg>
